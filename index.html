<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ziying Quant Strategy Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">ZQ</div>
          <div>
            <div class="brand-title">自营量化</div>
            <div class="brand-subtitle">Strategy Lab</div>
          </div>
        </div>
        <nav class="nav-stack" aria-label="Dashboard sections">
          <a href="#overview" class="nav-item active">概览</a>
          <a href="#strategies" class="nav-item">策略库</a>
          <a href="#model" class="nav-item">训练权重</a>
          <a href="#roadmap" class="nav-item">建设路线</a>
        </nav>
        <div class="server-box">
          <span class="status-dot"></span>
          <div>
            <div class="server-label">数据入口</div>
            <div class="server-url">43.103.51.239/ashare</div>
          </div>
        </div>
        <div class="server-box deploy-box">
          <span class="status-dot pages-dot"></span>
          <div>
            <div class="server-label">Pages 发布</div>
            <div id="deployInfo" class="server-url">本地预览</div>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">A 股日线 · 月度调仓 · 统一本金</p>
            <h1>量化策略回测驾驶舱</h1>
          </div>
          <div class="control-row">
            <label class="select-label" for="strategySelect">当前策略</label>
            <select id="strategySelect"></select>
          </div>
        </header>

        <section id="overview" class="metric-grid" aria-label="Key metrics"></section>

        <section class="chart-layout">
          <div class="panel equity-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Equity Curve</p>
                <h2>多策略净值对比</h2>
              </div>
              <div class="legend" id="equityLegend"></div>
            </div>
            <div id="equityChart" class="chart"></div>
          </div>
          <div class="panel detail-panel">
            <div class="panel-head compact">
              <div>
                <p class="eyebrow">Selected</p>
                <h2 id="selectedName">策略详情</h2>
              </div>
            </div>
            <p id="selectedDescription" class="strategy-description"></p>
            <div id="detailMetrics" class="detail-metrics"></div>
          </div>
        </section>

        <section id="strategies" class="split-layout">
          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Risk</p>
                <h2>回撤轨迹</h2>
              </div>
            </div>
            <div id="drawdownChart" class="chart small"></div>
          </div>
          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Calendar</p>
                <h2>年度收益</h2>
              </div>
            </div>
            <div id="yearlyChart" class="chart small"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Strategy Matrix</p>
              <h2>策略表现矩阵</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table id="strategyTable"></table>
          </div>
        </section>

        <section class="holdings-grid">
          <div class="panel">
            <div class="panel-head compact">
              <div>
                <p class="eyebrow">Portfolio</p>
                <h2>最近一期持仓</h2>
              </div>
            </div>
            <div class="table-wrap">
              <table id="holdingsTable"></table>
            </div>
          </div>
          <div id="model" class="panel">
            <div class="panel-head compact">
              <div>
                <p class="eyebrow">Training</p>
                <h2>滚动 IC 因子权重</h2>
              </div>
            </div>
            <div id="weightsHeatmap" class="heatmap"></div>
          </div>
        </section>

        <section id="roadmap" class="panel roadmap-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Build Plan</p>
              <h2>自营量化建设路线</h2>
            </div>
          </div>
          <div id="roadmapGrid" class="roadmap-grid"></div>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
